<script>
  const GOOGLE_SHEET_URL = "YOUR_NEW_DEPLOYMENT_URL_HERE";
  const ADMIN_PASSCODE = "admin123";

  let tickets = JSON.parse(localStorage.getItem('school_complaints')) || [];
  let isAdminLoggedIn = false;

  function saveData() {
    localStorage.setItem('school_complaints', JSON.stringify(tickets));
    renderBoard();
    renderPrivateBoard();
    if(isAdminLoggedIn) renderAdminBoard();
  }

  function fetchComplaintsFromSheet() {
    fetch(GOOGLE_SHEET_URL)
      .then(res => res.json())
      .then(data => {
        if (Array.isArray(data)) {
          tickets = data
            .filter(t => t && (t.id || t.subject) && String(t.id || t.subject).trim() !== "")
            .reverse();
          saveData();
        }
      })
      .catch(err => console.error("Cloud Fetch Error:", err));
  }

  document.getElementById('complaintForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const isPrivate = document.getElementById('privateCheck').checked;
    const newTicket = {
      id: "UNR-" + Math.floor(100 + Math.random() * 900),
      class: document.getElementById('classVal').value,
      studentId: document.getElementById('studentIdVal').value.trim(),
      category: document.getElementById('catVal').value,
      subject: document.getElementById('subjectVal').value,
      desc: document.getElementById('descVal').value,
      status: "Unresolved",
      isPrivate: isPrivate
    };

    tickets.unshift(newTicket);
    saveData();

    fetch(GOOGLE_SHEET_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify(newTicket)
    }).then(() => {
      setTimeout(fetchComplaintsFromSheet, 1000);
    });

    document.getElementById('complaintForm').reset();
    alert(isPrivate ? "Private Complaint Sent to Faculty!" : "Public Complaint Submitted!");
    
    if(isPrivate) {
      document.getElementById('searchStudentId').value = newTicket.studentId;
      switchTab('privateTab', document.querySelectorAll('.tab-btn')[2]);
    } else {
      switchTab('boardTab', document.querySelectorAll('.tab-btn')[1]);
    }
  });

  function getTicketOwnerId(ticket) {
    return String(ticket.studentId || '').trim();
  }

  function verifyOwnership(ticket) {
    if (isAdminLoggedIn) return true;
    
    const ownerId = getTicketOwnerId(ticket);
    if (!ownerId || ownerId.toLowerCase() === 'n/a') return true;

    const inputId = prompt(`Security Check: Complaint (${ticket.id || 'Ticket'}) ki Student ID enter karein:`);
    if (!inputId) return false;

    if (String(inputId).trim().toLowerCase() === ownerId.toLowerCase()) {
      return true;
    } else {
      alert(`❌ Security Check Failed!\nEntered: "${inputId}"\nSaved: "${ownerId}"`);
      return false;
    }
  }

  function resolveTicket(ticketId) {
    const ticket = tickets.find(t => String(t.id) === String(ticketId));
    if (ticket) {
      if (!verifyOwnership(ticket)) return;

      ticket.status = "Resolved";
      saveData();

      fetch(GOOGLE_SHEET_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({
          action: "updateStatus",
          id: ticket.id,
          status: "Resolved"
        })
      });
    }
  }

  function deleteTicket(ticketId) {
    const ticketIndex = tickets.findIndex(t => String(t.id) === String(ticketId));
    if (ticketIndex !== -1) {
      const ticket = tickets[ticketIndex];
      if (!verifyOwnership(ticket)) return;

      if (confirm("Kya aap is complaint ko delete karna chahte hain?")) {
        tickets.splice(ticketIndex, 1);
        saveData();

        fetch(GOOGLE_SHEET_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({
            action: "deleteTicket",
            id: ticket.id
          })
        });
      }
    }
  }

  function getHeaderTitle(t) {
    const idText = t.id ? t.id : '';
    const catText = t.category ? t.category : '';
    
    if (idText && catText) return `${idText} • ${catText}`;
    return idText || catText || 'Grievance Ticket';
  }

  function renderBoard() {
    const feed = document.getElementById('boardFeed');
    if (!feed) return;
    feed.innerHTML = "";

    const publicTickets = tickets.filter(t => t && !t.isPrivate);

    if (publicTickets.length === 0) {
      feed.innerHTML = "<p style='color:var(--text-muted); text-align:center;'>No public complaints submitted yet.</p>";
      return;
    }

    publicTickets.forEach(t => {
      const isResolved = (t.status || "").toLowerCase() === "resolved";
      const ownerId = getTicketOwnerId(t) || "N/A";
      const displayClass = t.class ? ` (${t.class})` : '';

      feed.innerHTML += `
        <div class="ticket-card">
          <div class="ticket-header">
            <span class="ticket-id">${getHeaderTitle(t)}</span>
            <span class="badge ${isResolved ? 'badge-resolved' : 'badge-unresolved'}">${t.status || 'Unresolved'}</span>
          </div>
          ${t.subject ? `<div class="ticket-title">${t.subject}</div>` : ''}
          ${t.desc ? `<div class="ticket-desc">${t.desc}</div>` : ''}
          <div class="ticket-footer">
            <span>ID: ${ownerId}${displayClass}</span>
            <div class="action-btns">
              ${!isResolved ? `<button class="btn-resolve" onclick="resolveTicket('${t.id}')">✓ Resolve</button>` : '<span style="color:#34d399; font-weight:700;">✓ Fixed</span>'}
              <button class="btn-delete" onclick="deleteTicket('${t.id}')">🗑️ Delete</button>
            </div>
          </div>
        </div>
      `;
    });
  }

  function renderPrivateBoard() {
    const feed = document.getElementById('privateFeed');
    if (!feed) return;
    
    const searchStudentId = document.getElementById('searchStudentId').value.trim();

    if (!searchStudentId) {
      feed.innerHTML = "<p style='color:var(--text-muted); text-align:center;'>Please enter your Student Unique ID above.</p>";
      return;
    }

    const myPrivateTickets = tickets.filter(t => t && t.isPrivate && getTicketOwnerId(t).toLowerCase() === searchStudentId.toLowerCase());
    feed.innerHTML = "";

    if (myPrivateTickets.length === 0) {
      feed.innerHTML = `<p style='color:var(--text-muted); text-align:center;'>No private complaints found for ID: <strong>${searchStudentId}</strong></p>`;
      return;
    }

    myPrivateTickets.forEach(t => {
      const isResolved = (t.status || "").toLowerCase() === "resolved";
      feed.innerHTML += `
        <div class="ticket-card private-card">
          <div class="ticket-header">
            <span class="ticket-id">${getHeaderTitle(t)}</span>
            <span class="badge badge-private">🔒 Private (Faculty Direct)</span>
          </div>
          ${t.subject ? `<div class="ticket-title">${t.subject}</div>` : ''}
          ${t.desc ? `<div class="ticket-desc">${t.desc}</div>` : ''}
          <div class="ticket-footer">
            <span>Status: <strong style="color:${isResolved ? '#34d399' : '#f87171'}">${t.status || 'Unresolved'}</strong></span>
            <div class="action-btns">
              ${!isResolved ? `<button class="btn-resolve" onclick="resolveTicket('${t.id}')">✓ Resolve</button>` : ''}
              <button class="btn-delete" onclick="deleteTicket('${t.id}')">🗑️ Delete</button>
            </div>
          </div>
        </div>
      `;
    });
  }

  function renderAdminBoard() {
    const feed = document.getElementById('adminFeed');
    if (!feed) return;
    feed.innerHTML = "";

    if (tickets.length === 0) {
      feed.innerHTML = "<p style='color:var(--text-muted); text-align:center;'>No complaints found in the database.</p>";
      return;
    }

    tickets.forEach(t => {
      const isResolved = (t.status || "").toLowerCase() === "resolved";
      const ownerId = getTicketOwnerId(t) || "N/A";
      const displayClass = t.class ? ` (${t.class})` : '';

      feed.innerHTML += `
        <div class="ticket-card ${t.isPrivate ? 'private-card' : ''}">
          <div class="ticket-header">
            <span class="ticket-id">${getHeaderTitle(t)} ${t.isPrivate ? '🔒 (Private)' : '🌐 (Public)'}</span>
            <span class="badge ${isResolved ? 'badge-resolved' : 'badge-unresolved'}">${t.status || 'Unresolved'}</span>
          </div>
          ${t.subject ? `<div class="ticket-title">${t.subject}</div>` : ''}
          ${t.desc ? `<div class="ticket-desc">${t.desc}</div>` : ''}
          <div class="ticket-footer">
            <span>Student ID: <strong style="color:#fff;">${ownerId}</strong>${displayClass}</span>
            <div class="action-btns">
              ${!isResolved ? `<button class="btn-resolve" onclick="resolveTicket('${t.id}')">✓ Resolve</button>` : '<span style="color:#34d399; font-weight:700;">✓ Resolved</span>'}
              <button class="btn-delete" onclick="deleteTicket('${t.id}')">🗑️ Delete</button>
            </div>
          </div>
        </div>
      `;
    });
  }

  function openAdminPanel(btn) {
    if (!isAdminLoggedIn) {
      const pass = prompt("🔑 Admin Passcode Enter Karein:");
      if (pass === ADMIN_PASSCODE) {
        isAdminLoggedIn = true;
        alert("✅ Admin Access Granted!");
        switchTab('adminTab', btn);
        renderAdminBoard();
      } else if (pass !== null) {
        alert("❌ Galat Passcode!");
      }
    } else {
      switchTab('adminTab', btn);
      renderAdminBoard();
    }
  }

  function logoutAdmin() {
    isAdminLoggedIn = false;
    alert("Admin Logged Out.");
    switchTab('boardTab', document.querySelectorAll('.tab-btn')[1]);
  }

  function switchTab(tabId, btn) {
    document.getElementById('submitTab').classList.add('hidden');
    document.getElementById('boardTab').classList.add('hidden');
    document.getElementById('privateTab').classList.add('hidden');
    document.getElementById('adminTab').classList.add('hidden');
    
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

    document.getElementById(tabId).classList.remove('hidden');
    btn.classList.add('active');
  }

  renderBoard();
  fetchComplaintsFromSheet();
  setInterval(fetchComplaintsFromSheet, 5000);
</script>
