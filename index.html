<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Grievance & Resolution Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0b1120;
      --card-bg: rgba(30, 41, 59, 0.7);
      --glass-border: rgba(255, 255, 255, 0.1);
      --school-blue: #3b82f6;
      --accent-cyan: #06b6d4;
      --success-green: #10b981;
      --warning-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }

    .container { max-width: 700px; margin: 0 auto; }

    /* BRANDING HEADER */
    .school-header {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(6, 182, 212, 0.2));
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      backdrop-filter: blur(10px);
    }

    .school-title { display: flex; align-items: center; gap: 12px; }
    .school-logo { font-size: 28px; }
    .school-name h2 { margin: 0; font-size: 16px; font-weight: 800; color: #fff; }
    .school-name p { margin: 2px 0 0 0; font-size: 11px; color: var(--accent-cyan); }

    .nav-tabs { display: flex; gap: 6px; background: rgba(0,0,0,0.4); padding: 4px; border-radius: 12px; }
    .tab-btn {
      background: none; border: none; color: var(--text-muted);
      padding: 8px 12px; border-radius: 8px; font-weight: 600; font-size: 12px;
      cursor: pointer; transition: all 0.2s ease;
    }
    .tab-btn.active { background: var(--school-blue); color: #fff; }

    /* CARD STYLE */
    .glass-card {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      margin-bottom: 20px;
    }

    .section-title { font-size: 14px; font-weight: 700; color: var(--text-muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }

    /* FORM ELEMENTS */
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--text-main); }
    
    .input-field {
      width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--glass-border);
      border-radius: 8px; padding: 10px 14px; color: #fff; font-size: 13px; box-sizing: border-box; outline: none;
    }
    .input-field option { background: #0f172a; color: #fff; }
    .input-field:focus { border-color: var(--school-blue); }

    .btn-submit {
      width: 100%; background: linear-gradient(135deg, var(--school-blue), var(--accent-cyan));
      border: none; color: white; padding: 12px; border-radius: 8px; font-weight: 700;
      font-size: 14px; cursor: pointer; transition: 0.2s ease;
    }
    .btn-submit:hover { opacity: 0.9; }

    /* FEED & CARDS */
    .ticket-card {
      background: rgba(15, 23, 42, 0.5); border: 1px solid var(--glass-border);
      padding: 16px; border-radius: 12px; margin-bottom: 12px;
    }
    .ticket-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .ticket-id { font-size: 12px; font-weight: 700; color: var(--accent-cyan); }
    
    .badge {
      font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 6px; text-transform: uppercase;
    }
    .badge-unresolved { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .badge-resolved { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }

    .ticket-title { font-size: 14px; font-weight: 700; margin: 0 0 6px 0; }
    .ticket-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
    
    .ticket-footer {
      display: flex; justify-content: space-between; align-items: center;
      border-top: 1px dashed var(--glass-border); padding-top: 10px; font-size: 11px; color: var(--text-muted);
    }

    /* DIRECT RESOLVE BUTTON */
    .btn-resolve {
      background: rgba(16, 185, 129, 0.15); border: 1px solid var(--success-green);
      color: #34d399; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700;
      cursor: pointer; transition: 0.2s ease;
    }
    .btn-resolve:hover { background: var(--success-green); color: #fff; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <div class="school-header">
      <div class="school-title">
        <span class="school-logo">🎓</span>
        <div class="school-name">
          <h2>STUDENT HELPDESK</h2>
          <p>Grievance & Resolution Portal</p>
        </div>
      </div>
      <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('submitTab', this)">File Issue</button>
        <button class="tab-btn" onclick="switchTab('boardTab', this)">Public Board</button>
      </div>
    </div>

    <div id="submitTab">
      <div class="glass-card">
        <div class="section-title">New Student Report</div>
        <form id="complaintForm">
          <div class="grid-2">
            <div class="form-group">
              <label>Class / Course Level</label>
              <select id="classVal" class="input-field" required>
                <option value="" disabled selected>Select Level</option>
                <option value="Class 8">Class 8</option>
                <option value="Class 9">Class 9</option>
                <option value="Class 10">Class 10</option>
                <option value="Class 11">Class 11</option>
                <option value="Class 12">Class 12</option>
                <option value="UG - 1st Year">UG - 1st Year</option>
                <option value="UG - 2nd Year">UG - 2nd Year</option>
                <option value="UG - 3rd Year">UG - 3rd Year</option>
                <option value="UG - 4th Year">UG - 4th Year</option>
                <option value="PG - 1st Year">PG - 1st Year</option>
                <option value="PG - 2nd Year">PG - 2nd Year</option>
              </select>
            </div>
            <div class="form-group">
              <label>Roll / Student ID</label>
              <input type="text" id="rollVal" class="input-field" placeholder="e.g. ST-402" required>
            </div>
          </div>

          <div class="form-group">
            <label>Category</label>
            <select id="catVal" class="input-field" required>
              <option value="Facilities">Facilities (Water, Fan, Bench)</option>
              <option value="Academics">Academics & Library</option>
              <option value="Faculty">Faculty & Staff</option>
              <option value="Canteen">Canteen & Hygiene</option>
              <option value="Sports">Sports Equipment</option>
              <option value="Safety">Safety & Campus</option>
            </select>
          </div>

          <div class="form-group">
            <label>Complaint Subject</label>
            <input type="text" id="subjectVal" class="input-field" placeholder="Brief subject line..." required>
          </div>

          <div class="form-group">
            <label>Detailed Description</label>
            <textarea id="descVal" class="input-field" rows="3" placeholder="Explain the issue in detail..." required></textarea>
          </div>

          <button type="submit" class="btn-submit">Submit Complaint</button>
        </form>
      </div>
    </div>

    <div id="boardTab" class="hidden">
      <div class="glass-card">
        <div class="section-title">Live Grievance Board</div>
        <div id="boardFeed">Loading complaints...</div>
      </div>
    </div>
  </div>

  <script>
    // Paste Apps Script URL here
    const GOOGLE_SHEET_URL = "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE";

    let tickets = JSON.parse(localStorage.getItem('school_complaints')) || [];

    function saveData() {
      localStorage.setItem('school_complaints', JSON.stringify(tickets));
      renderBoard();
    }

    // Google Sheets se Live Fetch
    function fetchComplaintsFromSheet() {
      if (GOOGLE_SHEET_URL !== "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE") {
        fetch(GOOGLE_SHEET_URL)
          .then(res => res.json())
          .then(data => {
            if (Array.isArray(data) && data.length > 0) {
              tickets = data.reverse();
              localStorage.setItem('school_complaints', JSON.stringify(tickets));
              renderBoard();
            }
          })
          .catch(err => console.error("Cloud Fetch Error:", err));
      }
    }

    // Form Submit
    document.getElementById('complaintForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const newTicket = {
        id: "UNR-" + Math.floor(100 + Math.random() * 900),
        class: document.getElementById('classVal').value,
        rollNo: document.getElementById('rollVal').value,
        category: document.getElementById('catVal').value,
        subject: document.getElementById('subjectVal').value,
        desc: document.getElementById('descVal').value,
        status: "Unresolved"
      };

      // Push to Google Sheets
      if (GOOGLE_SHEET_URL !== "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE") {
        fetch(GOOGLE_SHEET_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify(newTicket)
        }).then(() => {
          setTimeout(fetchComplaintsFromSheet, 1000);
        });
      }

      tickets.unshift(newTicket);
      saveData();
      document.getElementById('complaintForm').reset();
      alert("Complaint Submitted Successfully!");
      switchTab('boardTab', document.querySelectorAll('.tab-btn')[1]);
    });

    // Direct Status Update (Website Se Mark as Resolved)
    function resolveTicket(ticketId) {
      const ticket = tickets.find(t => t.id === ticketId);
      if (ticket) {
        ticket.status = "Resolved";
        saveData();
      }
    }

    // UI Render
    function renderBoard() {
      const feed = document.getElementById('boardFeed');
      feed.innerHTML = "";

      if (tickets.length === 0) {
        feed.innerHTML = "<p style='color:var(--text-muted); text-align:center;'>No complaints submitted yet.</p>";
        return;
      }

      tickets.forEach(t => {
        const isResolved = t.status === "Resolved";
        feed.innerHTML += `
          <div class="ticket-card">
            <div class="ticket-header">
              <span class="ticket-id">${t.id || 'UNR-100'} • ${t.category}</span>
              <span class="badge ${isResolved ? 'badge-resolved' : 'badge-unresolved'}">${t.status}</span>
            </div>
            <div class="ticket-title">${t.subject}</div>
            <div class="ticket-desc">${t.desc}</div>
            <div class="ticket-footer">
              <span>By: Roll ${t.rollNo} (${t.class})</span>
              ${!isResolved ? `<button class="btn-resolve" onclick="resolveTicket('${t.id}')">✓ Mark as Resolved</button>` : '<span style="color:#34d399; font-weight:700;">✓ Fixed</span>'}
            </div>
          </div>
        `;
      });
    }

    // Tab Switcher
    function switchTab(tabId, btn) {
      document.getElementById('submitTab').classList.add('hidden');
      document.getElementById('boardTab').classList.add('hidden');
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

      document.getElementById(tabId).classList.remove('hidden');
      btn.classList.add('active');
    }

    // Run On Load
    fetchComplaintsFromSheet();
    renderBoard();
  </script>
</body>
</html>
